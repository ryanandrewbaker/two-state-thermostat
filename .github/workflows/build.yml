name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify bundle exists
        run: test -f dist/two-state-thermostat.js

      - uses: actions/upload-artifact@v4
        with:
          name: two-state-thermostat
          path: dist/two-state-thermostat.js
