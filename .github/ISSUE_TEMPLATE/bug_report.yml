name: Bug Report
description: Report a problem with Two Stage Thermostat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: Paste your YAML configuration (redact entity names if needed)
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
