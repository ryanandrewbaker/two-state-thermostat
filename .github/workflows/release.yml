name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify bundle exists
        run: test -f dist/two-state-thermostat.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/two-state-thermostat.js
          generate_release_notes: true
